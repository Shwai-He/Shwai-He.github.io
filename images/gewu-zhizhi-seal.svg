<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" class="seal-svg">
  <defs>
    <filter id="seal-texture" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- Outer Seal Border -->
  <rect x="8" y="8" width="104" height="104" rx="6" ry="6" fill="none" stroke="#b22b27" stroke-width="6" filter="url(#seal-texture)"/>
  <!-- Inner Border Line -->
  <rect x="16" y="16" width="88" height="88" rx="3" ry="3" fill="none" stroke="#b22b27" stroke-width="1.5" opacity="0.6"/>
  <!-- Central Dividing Crosshair (Ancient Seal Style) -->
  <line x1="60" y1="16" x2="60" y2="104" stroke="#b22b27" stroke-width="1.2" opacity="0.4" stroke-dasharray="2 2"/>
  <line x1="16" y1="60" x2="104" y2="60" stroke="#b22b27" stroke-width="1.2" opacity="0.4" stroke-dasharray="2 2"/>
  
  <!-- Characters: Read Right-to-Left, Top-to-Bottom -->
  <!-- Top Right: 格 -->
  <text x="81" y="48" font-family="'Ma Shan Zheng', 'Noto Serif SC', 'STKaiti', 'KaiTi', serif" font-size="32" font-weight="bold" fill="#b22b27" text-anchor="middle" dominant-baseline="central">格</text>
  <!-- Bottom Right: 物 -->
  <text x="81" y="84" font-family="'Ma Shan Zheng', 'Noto Serif SC', 'STKaiti', 'KaiTi', serif" font-size="32" font-weight="bold" fill="#b22b27" text-anchor="middle" dominant-baseline="central">物</text>
  <!-- Top Left: 致 -->
  <text x="39" y="48" font-family="'Ma Shan Zheng', 'Noto Serif SC', 'STKaiti', 'KaiTi', serif" font-size="32" font-weight="bold" fill="#b22b27" text-anchor="middle" dominant-baseline="central">致</text>
  <!-- Bottom Left: 知 -->
  <text x="39" y="84" font-family="'Ma Shan Zheng', 'Noto Serif SC', 'STKaiti', 'KaiTi', serif" font-size="32" font-weight="bold" fill="#b22b27" text-anchor="middle" dominant-baseline="central">知</text>
</svg>